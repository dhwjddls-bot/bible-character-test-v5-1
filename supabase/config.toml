project_id = "bible-character-test-v5-1"

[auth]
enabled = true
site_url = "https://dhwjddls-bot.github.io/"
additional_redirect_urls = [
  "https://dhwjddls-bot.github.io/",
  "https://dhwjddls-bot.github.io/bible-character-test-v5-1/"
]

# 기존 운영 프로젝트의 인증 보안값을 명시해 config push 때 기본값으로 바뀌지 않게 합니다.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.naver-userinfo]
verify_jwt = false

[functions.shared-result]
verify_jwt = false
